description: >-
  Sears Holdings was the American holding company behind the Sears and Kmart department store
  chains. It filed for Chapter 11 in October 2018 and its retail operations were acquired in 2019
  by Transform Holdco LLC, which trades as Transformco (Transform SR Brands LLC), the entity that
  operates Sears.com, Kmart.com and ShopYourWay.com today. The live developer surface carried
  forward from that estate is the Sears Marketplace Seller API — a versioned XML-over-HTTPS
  integration for third-party sellers covering catalog and item management, item class and
  attribute libraries, inventory, pricing, purchase order retrieval, order cancellations, returns
  and partial or full refunds, ASN and shipment updates, order prep time, installation service
  items, and remittance, removed-item, content-match and processing reports. Every API is
  published with a downloadable XSD and a sample XML document, both fetchable without credentials
  from seller.marketplace.sears.com, and calls are signed with an HMAC-SHA256 authorization
  header rather than OAuth. There is no OpenAPI, GraphQL, MCP server or A2A agent card on any
  Sears, Kmart or Transformco host.
apis:
  - name: Sears Marketplace Seller API
    description: >-
      Versioned XML-over-HTTPS API for third-party sellers on Sears Marketplace (Sears.com,
      Kmart.com, ShopYourWay.com). GET calls export purchase orders, inventory, item classes,
      attributes, cancellation requests, return requests and remittance/removed-item/content-match
      reports; PUT calls import items, inventory, pricing, ASNs, order cancellations, order
      adjustments (returns and refunds), order prep time and service-item configurations. Every
      operation is described by a published XSD. Authorization is an HMAC-SHA256 signature over
      "sellerId:emailaddress:timestamp" with a 30-minute timestamp validity.
    humanURL: https://marketplace.sears.com/docs/api-guide/
    baseURL: https://seller.marketplace.sears.com/SellerPortal/api
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/sears-holdings.png
    tags:
